[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.5",
    "scipy==1.15.2",
    "pandas==2.2.3",
    "matplotlib==3.10.1",
    "astropy==7.0.1",
    "emcee==3.1.6",
    "dustmaps==1.0.14",
    "scikit-optimize==0.10.2",
    "shapely==2.1.1",
    "initial_mass_function @ git+https://github.com/keflavich/imf.git",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronos = ["data/**/*"]
